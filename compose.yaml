
services:
  node-app:
    build:
      context: .
      dockerfile: './containers/Dockerfile.dev'
    container_name: node-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
    ports:
      - 3000:3000
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: '.'
        target: '/usr/src/app'
        read_only: false

  db:
    image: postgres
    restart: always
    container_name: postgres
    env_file:
      - ./docker.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 10s
      timeout: 30s
      retries: 3
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - 5432:5432  
    
volumes:
  db_data:

networks:
  default:
    name: node-toolkit-network
    driver: bridge
